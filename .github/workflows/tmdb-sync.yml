name: TMDB Content Sync

on:
  schedule:
    # UTC slots gated to 01:00 America/New_York, including DST.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only (no content writes)
        type: boolean
        default: true
      max_items:
        description: Maximum items per TMDB feed (1–1000; oversized feeds fail, never truncate)
        type: number
        default: 250

permissions:
  contents: read

concurrency:
  group: tmdb-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      SITE_URL: ${{ vars.WEBSITE_URL || 'https://dsanchezcr.com' }}
      TMDB_SYNC_KEY: ${{ secrets.TMDB_SYNC_KEY }}
      TMDB_SYNC_MAX_ITEMS: ${{ vars.TMDB_SYNC_MAX_ITEMS || '250' }}
      EVENT_NAME: ${{ github.event_name }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_MAX_ITEMS: ${{ inputs.max_items }}
    steps:
      - name: Sync configured TMDB account at 1 AM Eastern
        # No source credentials in GitHub; only the dedicated invocation key.
        # Environment variables keep workflow inputs out of executable shell text.
        shell: bash
        run: |
          node -e '
          (async () => {
            const manual = process.env.EVENT_NAME === "workflow_dispatch";
            const hour = new Intl.DateTimeFormat("en-US", {
              timeZone: "America/New_York", hour: "2-digit", hourCycle: "h23"
            }).format(new Date());
            if (!manual && hour !== "01") {
              console.log("Not 1 AM Eastern; skipping this UTC slot.");
              return;
            }
            const maxItems = Number(manual ? process.env.INPUT_MAX_ITEMS : process.env.TMDB_SYNC_MAX_ITEMS);
            const dryRun = manual ? process.env.INPUT_DRY_RUN !== "false" : false;
            if (!Number.isInteger(maxItems) || maxItems < 1 || maxItems > 1000)
              throw new Error("maxItems must be an integer between 1 and 1000.");
            if (!process.env.TMDB_SYNC_KEY) throw new Error("TMDB_SYNC_KEY is not configured.");
            const base = new URL(process.env.SITE_URL);
            if (base.protocol !== "https:" || base.username || base.password)
              throw new Error("WEBSITE_URL must be an HTTPS site URL without credentials.");
            let continuationToken;
            let retries = 0;
            for (let call = 1; call <= 220; call++) {
              const response = await fetch(new URL("/api/content-admin/tmdb/sync", base), {
                method: "POST", redirect: "error", signal: AbortSignal.timeout(45000),
                headers: { "Content-Type": "application/json", "X-Tmdb-Sync-Key": process.env.TMDB_SYNC_KEY },
                body: JSON.stringify({ dryRun, maxItems, continuationToken })
              });
              console.log("Batch request", call, "HTTP", response.status);
              const result = await response.json();
              // Continuation cursors contain no credentials and grant no authorization.
              // Counters are cumulative; warnings are per response, so print every batch.
              console.log(JSON.stringify(result, null, 2));
              if (!response.ok) {
                if ([500, 504].includes(response.status) && result.retryable === true && retries < 3) {
                  retries++;
                  continuationToken = result.partialResult?.continuationToken ?? continuationToken;
                  await new Promise(resolve => setTimeout(resolve, 1000));
                  continue;
                }
                throw new Error("TMDB sync failed; inspect the safe API error/partial progress above.");
              }
              if (!Array.isArray(result.warnings) || result.deleted !== 0 || typeof result.completed !== "boolean")
                throw new Error("Unexpected TMDB sync response contract.");
              if (result.completed) return;
              if (typeof result.continuationToken !== "string" || !result.continuationToken)
                throw new Error("Incomplete sync response omitted its continuation token.");
              continuationToken = result.continuationToken;
              retries = 0;
            }
            throw new Error("TMDB continuation limit reached; resume with the last cursor shown above.");
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          '
