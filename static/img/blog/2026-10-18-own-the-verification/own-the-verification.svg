<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Own the Verification</title>
  <desc id="hero-desc">An attentive practitioner at a sunlit workbench supervises a workflow from an intention target through three bounded task modules to evidence cards and a closed review gate. One hand holds the manual release control; the other examines evidence through a magnifying glass. Warm terracotta, teal and amber emphasize human judgment and useful automation.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffcf5"/>
      <stop offset="1" stop-color="#f6f1e7"/>
    </linearGradient>
    <linearGradient id="daylight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#def2eb"/>
      <stop offset="1" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#eee2cb"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e79470"/>
      <stop offset="1" stop-color="#c46147"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#b4e1d4" stop-opacity=".3"/>
    </linearGradient>
  </defs>

